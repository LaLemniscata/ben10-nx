<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben 10: Protector of Earth</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f5f6f3; --card: #ffffff; --ink: #151a1f; --muted: #5d6871; --line: #e2e5e0;
    --accent: #0b7a57; --accent-ink: #ffffff; --soft: #e6f3ee; --danger: #b3372f; --danger-soft: #fbeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101417; --card: #181d21; --ink: #eef1f0; --muted: #9aa5ad; --line: #2a3137;
      --accent: #3ccf9a; --accent-ink: #06231a; --soft: #16302a; --danger: #ff8d84; --danger-soft: #38201e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink); line-height: 1.5;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  header img { width: 64px; height: 64px; border-radius: 12px; }
  h1 { font-size: 20px; line-height: 1.25; margin: 0; font-weight: 650; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  h2 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  button {
    font: inherit; font-weight: 600; border-radius: 9px; padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .file { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 9px; padding: 10px 12px; margin-top: 14px; overflow-wrap: anywhere; font-size: 14px; }
  .error { background: var(--danger-soft); color: var(--danger); border-radius: 9px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
  ol.steps { list-style: none; margin: 18px 0 0; padding: 0; }
  ol.steps li { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; color: var(--muted); }
  ol.steps li.now { color: var(--ink); font-weight: 600; }
  ol.steps li.done { color: var(--ink); }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
  li.now .dot { border-color: var(--accent); border-top-color: transparent; animation: turn 1s linear infinite; }
  li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { li.now .dot { animation: none; border-top-color: var(--accent); } }
  .detail { font-size: 13px; color: var(--muted); font-weight: 400; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .drives { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .card-switch { font-size: 12px; font-weight: 400; display: block; }
  .hint { background: var(--soft); border-radius: 9px; padding: 12px 14px; margin-top: 18px; font-size: 14px; }
  .hint strong { display: block; margin-bottom: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="" id="cover" alt="">
    <div>
      <h1>Ben 10: Protector of Earth</h1>
      <p data-t="subtitle"></p>
    </div>
  </header>

  <section id="welcome" hidden>
    <h2 data-t="welcome_title"></h2>
    <p data-t="welcome_text"></p>
    <p class="muted" data-t="welcome_note"></p>
    <div class="file" id="chosen" hidden></div>
    <div class="error" id="welcome_error" hidden></div>
    <div class="actions">
      <button id="pick" class="primary" data-t="pick"></button>
      <button id="start" class="primary" data-t="start" hidden></button>
    </div>
  </section>

  <section id="working" hidden>
    <h2 data-t="working_title"></h2>
    <p class="muted" data-t="working_text"></p>
    <div class="bar"><i id="overall"></i></div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section id="failed" hidden>
    <h2 data-t="failed_title"></h2>
    <div class="error" id="failed_error"></div>
    <div class="actions">
      <button id="retry" class="primary" data-t="retry"></button>
      <button id="showlog" data-t="log"></button>
    </div>
  </section>

  <section id="done" hidden>
    <h2 data-t="done_title"></h2>
    <p id="done_text" data-t="done_text"></p>
    <div id="card_choice">
      <div class="drives" id="drives"></div>
      <p class="muted" id="no_card" data-t="no_card" hidden></p>
    </div>
    <div id="copying" hidden>
      <p data-t="copying"></p>
      <div class="bar"><i id="copybar"></i></div>
    </div>
    <div class="error" id="copy_error" hidden></div>
    <div class="hint" id="copied" hidden>
      <strong data-t="copied_title"></strong>
      <span data-t="copied_text"></span>
    </div>
    <div class="actions"><button id="folder" data-t="folder"></button></div>
    <p class="muted" style="margin:16px 0 0" data-t="share"></p>
  </section>
</main>

<script>
const TEXT = {
  en: {
    subtitle: 'Port for Nintendo Switch',
    welcome_title: 'Choose your copy of the game',
    welcome_text: 'Pick your own disc image (.iso) of the American edition, ULUS10307. The port is built from it, here on this computer.',
    welcome_note: 'Nothing is uploaded. It downloads one thing: Arm\'s free compiler, about 170 MB.',
    pick: 'Choose disc image', pick_other: 'Choose another', start: 'Build the port',
    working_title: 'Building your port',
    working_text: 'This takes 5 to 30 minutes, and the computer will be busy. You can leave this page open and do something else.',
    s_compiler: 'Getting the compiler', s_decrypt: 'Reading the game from your disc', s_translate: 'Translating the game',
    s_compile: 'Compiling for the Switch', s_link: 'Making the Switch program', s_ready: 'Preparing your files',
    failed_title: 'The build stopped', retry: 'Try again', log: 'Open the log',
    done_title: 'Your port is ready',
    done_text: 'Connect your SD card and choose it below to copy everything. Your saves are kept.',
    no_card: 'No SD card found. Connect it and it appears here, or copy the "switch" folder from the output folder to the root of the card.',
    folder: 'Open the output folder', copying: 'Copying to the card...', free: 'free', switch_card: 'Switch card',
    copied_title: 'Copied. Now, on the Switch:',
    copied_text: 'Hold R while starting any installed game, then open Ben 10: Protector of Earth. To quit, press + and − together.',
    share: 'What was built contains code from the game: it is for your own console, so please do not share it.',
  },
  pt: {
    subtitle: 'Port para Nintendo Switch',
    welcome_title: 'Escolha sua cópia do jogo',
    welcome_text: 'Selecione a sua própria imagem do disco (.iso) da edição americana, ULUS10307. O port é gerado a partir dela, aqui neste computador.',
    welcome_note: 'Nada é enviado para a internet. Ele só baixa uma coisa: o compilador gratuito da Arm, de cerca de 170 MB.',
    pick: 'Escolher imagem do disco', pick_other: 'Escolher outra', start: 'Gerar o port',
    working_title: 'Gerando o seu port',
    working_text: 'Isso leva de 5 a 30 minutos, e o computador vai ficar ocupado. Pode deixar esta página aberta e fazer outra coisa.',
    s_compiler: 'Obtendo o compilador', s_decrypt: 'Lendo o jogo do seu disco', s_translate: 'Traduzindo o jogo',
    s_compile: 'Compilando para o Switch', s_link: 'Gerando o programa do Switch', s_ready: 'Preparando os arquivos',
    failed_title: 'A geração parou', retry: 'Tentar de novo', log: 'Abrir o log',
    done_title: 'Seu port está pronto',
    done_text: 'Conecte o cartão e escolha abaixo para copiar tudo. Seus saves são mantidos.',
    no_card: 'Nenhum cartão encontrado. Conecte e ele aparece aqui, ou copie a pasta "switch" da pasta de saída para a raiz do cartão.',
    folder: 'Abrir a pasta de saída', copying: 'Copiando para o cartão...', free: 'livres', switch_card: 'Cartão do Switch',
    copied_title: 'Copiado. Agora, no Switch:',
    copied_text: 'Segure R ao abrir qualquer jogo instalado e escolha Ben 10: Protector of Earth. Para sair, aperte + e − juntos.',
    share: 'O que foi gerado contém código do jogo: é para o seu console, então não compartilhe.',
  },
};
const STEPS = ['compiler', 'decrypt', 'translate', 'compile', 'link', 'ready'];
const WEIGHT = {compiler: 8, decrypt: 2, translate: 5, compile: 80, link: 3, ready: 2};
const token = new URLSearchParams(location.search).get('t');
const $ = id => document.getElementById(id);
let lang = 'en';

function api(path) { return fetch(`${path}${path.includes('?') ? '&' : '?'}t=${token}`, {method: 'POST'}); }

function applyText() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-t]').forEach(node => { node.textContent = TEXT[lang][node.dataset.t]; });
  $('steps').replaceChildren(...STEPS.map(step => {
    const row = document.createElement('li');
    row.id = `step_${step}`;
    row.innerHTML = '<span class="dot"></span><span class="name"></span><span class="detail"></span>';
    row.querySelector('.name').textContent = TEXT[lang][`s_${step}`];
    return row;
  }));
}

function renderSteps(state) {
  const current = STEPS.indexOf(state.stage);
  let overall = 0;
  STEPS.forEach((step, index) => {
    const row = $(`step_${step}`);
    const finished = index < current;
    row.className = finished ? 'done' : index === current ? 'now' : '';
    row.querySelector('.dot').textContent = finished ? '✓' : '';
    row.querySelector('.detail').textContent = index === current ? state.detail : '';
    overall += WEIGHT[step] * (finished ? 1 : index === current ? state.fraction : 0);
  });
  $('overall').style.width = `${overall}%`;
}

function renderDrives(state) {
  const drives = state.drives || [];
  $('no_card').hidden = drives.length > 0;
  const signature = JSON.stringify(drives);
  if ($('drives').dataset.signature === signature) return;
  $('drives').dataset.signature = signature;
  $('drives').replaceChildren(...drives.map((drive, index) => {
    const button = document.createElement('button');
    if (index === 0) button.className = 'primary';
    const name = drive.label ? `${drive.label} (${drive.letter}:)` : `${drive.letter}:`;
    button.textContent = name;
    const note = document.createElement('span');
    note.className = 'card-switch';
    note.textContent = `${drive.switch ? `${TEXT[lang].switch_card} · ` : ''}${drive.free_gb} GB ${TEXT[lang].free}`;
    button.append(note);
    button.addEventListener('click', () => api(`/copy?drive=${drive.letter}`));
    return button;
  }));
}

function render(state) {
  if (state.lang !== lang) { lang = state.lang; applyText(); }
  ['welcome', 'working', 'failed', 'done'].forEach(id => { $(id).hidden = state.screen !== id; });
  $('chosen').hidden = !state.iso_name;
  $('chosen').textContent = state.iso_name;
  $('start').hidden = !state.iso;
  $('pick').className = state.iso ? '' : 'primary';
  $('pick').textContent = TEXT[lang][state.iso ? 'pick_other' : 'pick'];
  $('welcome_error').hidden = !state.error;
  $('welcome_error').textContent = state.error;
  $('failed_error').textContent = state.error;
  if (state.screen === 'working') renderSteps(state);
  if (state.screen === 'done') {
    renderDrives(state);
    $('copying').hidden = state.copy_state !== 'copying';
    $('card_choice').hidden = state.copy_state === 'copying' || state.copy_state === 'done';
    $('done_text').hidden = state.copy_state === 'done';
    $('copybar').style.width = `${state.copy_fraction * 100}%`;
    $('copied').hidden = state.copy_state !== 'done';
    $('copy_error').hidden = !state.copy_error;
    $('copy_error').textContent = state.copy_error;
  }
}

async function poll() {
  try {
    const reply = await fetch(`/state?t=${token}`);
    render(await reply.json());
  } catch (error) {
    /* the program has ended or is busy: the next poll decides */
  }
  setTimeout(poll, 800);
}

$('cover').src = `/cover.jpg?t=${token}`;
applyText();
$('pick').addEventListener('click', () => api('/pick'));
$('start').addEventListener('click', () => api('/start'));
$('retry').addEventListener('click', () => api('/start'));
$('showlog').addEventListener('click', () => api('/log'));
$('folder').addEventListener('click', () => api('/folder'));
poll();
</script>
</body>
</html>
